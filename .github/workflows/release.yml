name: Create Foundry Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Build module package
        run: |
          mkdir package
          cp module.json README.md CHANGELOG.md LICENSE package/
          cp -r assets lang scripts styles templates package/
          cd package
          zip -r ../curse-of-death-and-despair.zip .

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              module.json \
              curse-of-death-and-despair.zip \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              module.json \
              curse-of-death-and-despair.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi